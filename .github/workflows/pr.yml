name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  Check:
    if: >-
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2

      - name: Run Checks
        run: |
          bun install --frozen-lockfile
          bunx --no-install eslint . --ext .ts
          bunx --no-install tsc --noEmit
          bun test
          bun build ./src/index.ts --outdir dist --target bun
      - name: Built plugin smoke
        run: |
          bun -e 'const { default: plugin } = await import("./dist/index.js"); const hooks = await plugin({}); if (!hooks.tool?.evaluate_prompt || !hooks["chat.message"]) throw new Error("Plugin hooks missing");'
